---
- name: Base configuration and authentication for all cluster nodes
  hosts: cluster
  become: true
  roles:
    - common
    - munge

- name: Slurm accounting database and daemon
  hosts: controller
  become: true
  roles:
    - slurmdbd

- name: Slurm controller and compute nodes
  hosts: cluster
  become: true
  roles:
    - slurm
