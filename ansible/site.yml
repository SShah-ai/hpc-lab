---
- name: Base configuration and authentication for all cluster nodes
  hosts: cluster
  become: true
  roles:
    - common
    - munge

- name: Directory server (389 DS) on the controller
  hosts: controller
  become: true
  roles:
    - ldap_server
    - ldap_accounts

- name: LDAP clients on every node
  hosts: cluster
  become: true
  roles:
    - ldap_client

- name: Slurm accounting database and daemon
  hosts: controller
  become: true
  roles:
    - slurmdbd

- name: Slurm controller and compute nodes
  hosts: cluster
  become: true
  roles:
    - slurm

- name: Slurm accounts and users
  hosts: controller
  become: true
  roles:
    - slurm_accounts
