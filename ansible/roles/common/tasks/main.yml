---
- name: Install base packages
  community.general.zypper:
    name: "{{ base_packages }}"
    state: present

- name: Deploy cluster /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: Ensure chronyd is enabled and running
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Keep the systemd journal across reboots
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-persistent.conf
    content: |
      [Journal]
      Storage=persistent
    mode: "0644"
  notify:
    - Restart journald
    - Flush journal to disk


- name: Disable repositories not needed on cluster nodes
  community.general.zypper_repository:
    name: "{{ item.name }}"
    repo: "{{ item.repo }}"
    enabled: false
    description: "{{ item.description }}"

  loop:
    - { name: repo-non-oss, description: "Non-OSS Repository", repo: "http://download.opensuse.org/distribution/leap/15.6/repo/non-oss/" }
    - { name: repo-update-non-oss, description: "Non-OSS Repository", repo: "http://download.opensuse.org/update/leap/15.6/non-oss/" }
    - { name: repo-openh264, description: "Non-OSS Repository", repo: "http://codecs.opensuse.org/openh264/openSUSE_Leap/" }
