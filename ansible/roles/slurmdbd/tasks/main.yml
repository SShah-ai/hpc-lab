---
- name: Install MariaDB, its Python driver and the Slurm accounting packages
  community.general.zypper:
    name:
      - mariadb
      - python311-PyMySQL
      - slurm-slurmdbd
      - slurm-seff
    state: present

- name: Apply the MariaDB settings Slurm recommends
  ansible.builtin.template:
    src: mariadb-slurm.cnf.j2
    dest: /etc/my.cnf.d/slurm.cnf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart mariadb
    - Restart slurmdbd

- name: Ensure MariaDB is enabled and running
  ansible.builtin.systemd_service:
    name: mariadb
    enabled: true
    state: started

- name: Wait for the MariaDB socket
  ansible.builtin.wait_for:
    path: "{{ slurmdbd_mariadb_socket }}"
    timeout: 30

- name: Create the Slurm accounting database
  community.mysql.mysql_db:
    name: "{{ slurmdbd_db_name }}"
    state: present
    login_user: root
    login_unix_socket: "{{ slurmdbd_mariadb_socket }}"

- name: Create the Slurm database user
  community.mysql.mysql_user:
    name: "{{ slurmdbd_db_user }}"
    host: localhost
    password: "{{ slurmdbd_db_password }}"
    priv: "{{ slurmdbd_db_name }}.*:ALL"
    state: present
    login_user: root
    login_unix_socket: "{{ slurmdbd_mariadb_socket }}"
  no_log: true

- name: Remove anonymous database accounts
  community.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_user: root
    login_unix_socket: "{{ slurmdbd_mariadb_socket }}"

- name: Remove the test database
  community.mysql.mysql_db:
    name: test
    state: absent
    login_user: root
    login_unix_socket: "{{ slurmdbd_mariadb_socket }}"

- name: Create the Slurm log directory
  ansible.builtin.file:
    path: /var/log/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"

- name: Deploy slurmdbd.conf (contains the database password)
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: /etc/slurm/slurmdbd.conf
    owner: slurm
    group: slurm
    mode: "0600"
  diff: false
  notify: Restart slurmdbd

- name: Apply pending restarts now
  ansible.builtin.meta: flush_handlers

- name: Ensure slurmdbd is enabled and running
  ansible.builtin.systemd_service:
    name: slurmdbd
    enabled: true
    state: started

- name: Wait for slurmdbd to listen on its port
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 6819
    timeout: 60
